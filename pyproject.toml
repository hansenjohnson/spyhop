[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spyhop"
dynamic = ["version"]
description = "Data recorder with a live chart for marine mammal surveys"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "pyserial>=3.5",
  "pygeomag>=1.1",
  "tzdata; sys_platform == 'win32'",
  "tzfpy>=0.15",
]

[project.optional-dependencies]
window = ["pywebview>=5"]
test = ["pytest>=8"]

[project.scripts]
spyhop = "spyhop.__main__:main"

[tool.setuptools]
packages = ["spyhop"]

[tool.setuptools.dynamic]
version = {attr = "spyhop.__version__"}

[tool.setuptools.package-data]
spyhop = ["report_defs/*", "filter_defs/*", "web/*.html", "web/css/*", "web/js/*", "web/img/*", "web/vendor/*", "web/vendor/*/*", "web/vendor/*/*/*"]
